<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Радар 4x4 - Nowcast</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0b1a2f;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* ========== СТРАНИЦА ВХОДА ========== */
        #loginPage {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            background: #0d2137;
            padding: 50px 60px;
            border-radius: 24px;
            border: 1px solid #1e3a55;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.7);
            max-width: 420px;
            width: 100%;
            transition: all 0.3s;
        }
        #loginPage h1 {
            color: #7ec8f0;
            font-weight: 300;
            letter-spacing: 2px;
            font-size: 28px;
            text-shadow: 0 0 20px rgba(126, 200, 240, 0.2);
        }
        #loginPage .sub {
            color: #4a7090;
            font-size: 14px;
            margin-top: -10px;
        }
        #loginPage input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 12px;
            border: 2px solid #1e3a55;
            background: #0b1a2f;
            color: #b0d4f0;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        #loginPage input:focus {
            border-color: #4a9eff;
        }
        #loginPage input::placeholder {
            color: #2a4a6a;
        }
        #loginPage button {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #1a6bb0, #4a9eff);
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        #loginPage button:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(74, 158, 255, 0.3);
        }
        #loginPage .error {
            color: #ff6b6b;
            font-size: 13px;
            min-height: 20px;
        }
        #loginPage .hint {
            color: #3a5a7a;
            font-size: 12px;
            border-top: 1px solid #1a2a3f;
            padding-top: 15px;
            width: 100%;
            text-align: center;
        }

        /* ========== ОСНОВНАЯ СТРАНИЦА ========== */
        #mainPage {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        #mainPage.visible {
            display: flex;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 900px;
            margin-bottom: 20px;
        }
        .header h1 {
            color: #7ec8f0;
            font-weight: 300;
            letter-spacing: 2px;
            font-size: 24px;
            text-shadow: 0 0 20px rgba(126, 200, 240, 0.3);
        }
        .logout-btn {
            background: rgba(255, 50, 50, 0.15);
            border: 1px solid rgba(255, 50, 50, 0.3);
            color: #ff6b6b;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }
        .logout-btn:hover {
            background: rgba(255, 50, 50, 0.25);
            border-color: #ff6b6b;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            max-width: 900px;
            width: 100%;
            background: #0d2137;
            padding: 10px;
            border-radius: 16px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.7);
        }
        .cell {
            position: relative;
            background: #122b44;
            border-radius: 10px;
            overflow: hidden;
            aspect-ratio: 1 / 1;
            border: 1px solid #1e3a55;
            transition: transform 0.2s, border-color 0.2s;
        }
        .cell:hover {
            transform: scale(1.02);
            border-color: #4a9eff;
            z-index: 2;
        }
        .cell iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            pointer-events: none;
        }
        .label {
            position: absolute;
            bottom: 6px;
            left: 6px;
            background: rgba(0, 0, 0, 0.75);
            color: #b0d4f0;
            font-size: 9px;
            padding: 2px 8px;
            border-radius: 12px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.08);
            font-weight: 600;
            letter-spacing: 0.3px;
            pointer-events: none;
        }
        .time-label {
            position: absolute;
            top: 6px;
            right: 6px;
            background: rgba(255, 50, 50, 0.85);
            color: #fff;
            font-size: 8px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: bold;
            pointer-events: none;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .footer {
            margin-top: 16px;
            color: #4a7090;
            font-size: 12px;
            opacity: 0.9;
            text-align: center;
        }
        .footer a {
            color: #6aaff0;
            text-decoration: none;
        }
        .status {
            color: #7ec8f0;
            margin-top: 8px;
            font-size: 11px;
        }

        @media (max-width: 600px) {
            .grid { gap: 4px; padding: 6px; }
            .label { font-size: 7px; padding: 1px 6px; }
            .header h1 { font-size: 18px; }
            #loginPage { padding: 30px 25px; }
            #loginPage h1 { font-size: 22px; }
        }
    </style>
</head>
<body>

    <!-- ============================================================ -->
    <!-- СТРАНИЦА ВХОДА -->
    <!-- ============================================================ -->
    <div id="loginPage">
        <h1>🔐 РАДАР</h1>
        <div class="sub">Введите ключ доступа</div>
        <input type="password" id="passInput" placeholder="Введите ключ..." autofocus>
        <button id="loginBtn">▶ ВОЙТИ</button>
        <div class="error" id="loginError"></div>
        <div class="hint">Ключ: <strong style="color:#4a9eff;">enteng</strong></div>
    </div>

    <!-- ============================================================ -->
    <!-- ОСНОВНАЯ СТРАНИЦА С РАДАРОМ -->
    <!-- ============================================================ -->
    <div id="mainPage">
        <div class="header">
            <h1>🌦️ РАДАР 4×4 · NOWCAST</h1>
            <button class="logout-btn" id="logoutBtn">🚪 Выйти</button>
        </div>

        <div class="grid" id="radarGrid"></div>

        <div class="footer">
            ⚡ Данные радара OpenWeather · Обновление: <span id="updateTime"></span>
            <div class="status" id="statusMsg">🟢 Онлайн</div>
        </div>
    </div>

    <script>
        // ================================================================
        // НАСТРОЙКИ
        // ================================================================
        const CORRECT_PASSWORD = 'enteng';
        const API_KEY_RADAR  = 'a284a8b35f0cc8966d4b440e20be8202';
        const API_KEY_WEATHER = 'ffeb2fb565e3972a47073abcf7e84b77';

        // Координаты 4x4 (Москва и область)
        const locations = [
            { lat: 56.0, lon: 37.0, name: 'Сев-Зап' },
            { lat: 56.0, lon: 38.5, name: 'Сев-Центр' },
            { lat: 56.0, lon: 40.0, name: 'Сев-Вост' },
            { lat: 56.0, lon: 41.5, name: 'Сев-Крайн' },
            { lat: 55.0, lon: 37.0, name: 'Центр-Зап' },
            { lat: 55.0, lon: 38.5, name: 'Москва' },
            { lat: 55.0, lon: 40.0, name: 'Центр-Вост' },
            { lat: 55.0, lon: 41.5, name: 'Центр-Крайн' },
            { lat: 54.0, lon: 37.0, name: 'Юг-Зап' },
            { lat: 54.0, lon: 38.5, name: 'Юг-Центр' },
            { lat: 54.0, lon: 40.0, name: 'Юг-Вост' },
            { lat: 54.0, lon: 41.5, name: 'Юг-Крайн' },
            { lat: 53.0, lon: 37.0, name: 'Южн-Зап' },
            { lat: 53.0, lon: 38.5, name: 'Южн-Центр' },
            { lat: 53.0, lon: 40.0, name: 'Южн-Вост' },
            { lat: 53.0, lon: 41.5, name: 'Южн-Крайн' }
        ];

        // ================================================================
        // УПРАВЛЕНИЕ ВХОДОМ
        // ================================================================
        const loginPage = document.getElementById('loginPage');
        const mainPage = document.getElementById('mainPage');
        const passInput = document.getElementById('passInput');
        const loginBtn = document.getElementById('loginBtn');
        const loginError = document.getElementById('loginError');
        const logoutBtn = document.getElementById('logoutBtn');

        function doLogin() {
            const input = passInput.value.trim();
            if (input === CORRECT_PASSWORD) {
                loginPage.style.display = 'none';
                mainPage.classList.add('visible');
                loginError.textContent = '';
                passInput.value = '';
                renderGrid();
            } else {
                loginError.textContent = '❌ Неверный ключ. Попробуйте ещё раз.';
                passInput.value = '';
                passInput.focus();
            }
        }

        function doLogout() {
            mainPage.classList.remove('visible');
            loginPage.style.display = 'flex';
            passInput.value = '';
            passInput.focus();
        }

        // Вход по кнопке
        loginBtn.addEventListener('click', doLogin);

        // Вход по Enter
        passInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') doLogin();
        });

        // Выход
        logoutBtn.addEventListener('click', doLogout);

        // Автофокус на поле ввода
        passInput.focus();

        // ================================================================
        // ГЕНЕРАЦИЯ РАДАРА
        // ================================================================
        function renderGrid() {
            const grid = document.getElementById('radarGrid');
            grid.innerHTML = '';

            locations.forEach((loc) => {
                const cell = document.createElement('div');
                cell.className = 'cell';

                const zoom = 7;
                const tileX = getTileX(loc.lon, zoom);
                const tileY = getTileY(loc.lat, zoom);
                const radarUrl = `https://tile.openweathermap.org/map/precipitation_new/${zoom}/${tileX}/${tileY}.png?appid=${API_KEY_RADAR}`;

                const iframe = document.createElement('iframe');
                iframe.src = `data:text/html;charset=utf-8,
                    <html>
                        <head>
                            <style>
                                body { margin:0; background:#0b1a2f; display:flex; align-items:center; justify-content:center; height:100vh; overflow:hidden; }
                                img { width:100%; height:100%; object-fit:cover; }
                                .error { color:#4a7090; font-size:12px; text-align:center; padding:20px; }
                            </style>
                        </head>
                        <body>
                            <img src="${radarUrl}" 
                                 alt="радар"
                                 onerror="this.style.display='none';this.parentNode.innerHTML='<div class=\\'error\\'>⛅ Нет данных</div>'">
                        </body>
                    </html>
                `;
                iframe.style.width = '100%';
                iframe.style.height = '100%';
                iframe.style.border = 'none';
                iframe.style.pointerEvents = 'none';

                cell.appendChild(iframe);

                const label = document.createElement('div');
                label.className = 'label';
                label.textContent = loc.name;
                cell.appendChild(label);

                const live = document.createElement('div');
                live.className = 'time-label';
                live.textContent = '● LIVE';
                cell.appendChild(live);

                grid.appendChild(cell);
            });

            document.getElementById('updateTime').textContent = new Date().toLocaleTimeString('ru-RU');
        }

        // ================================================================
        // РАСЧЁТ ТАЙЛОВ
        // ================================================================
        function getTileX(lon, zoom) {
            return Math.floor((lon + 180) / 360 * Math.pow(2, zoom));
        }

        function getTileY(lat, zoom) {
            const latRad = lat * Math.PI / 180;
            return Math.floor((1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * Math.pow(2, zoom));
        }

        // ================================================================
        // АВТООБНОВЛЕНИЕ
        // ================================================================
        setInterval(() => {
            if (mainPage.classList.contains('visible')) {
                location.reload();
            }
        }, 300000);
    </script>

</body>
</html>
