<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timur Radar</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #060a0f;
      --panel: rgba(11, 15, 22, 0.96);
      --border: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #3b82f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      overflow: hidden; height: 100vh;
    }

    #login {
      position: fixed; inset: 0; z-index: 99999;
      background: #060a0f;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
    }
    #login h1 {
      font-size: 24px; font-weight: 600; letter-spacing: 3px;
      background: linear-gradient(90deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    #login input {
      background: #1e293b; border: 1px solid #334155; color: white;
      padding: 14px 20px; border-radius: 12px; font-size: 16px;
      width: 280px; outline: none;
    }
    #login input:focus { border-color: var(--accent); }
    #login button {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border: none; color: white; padding: 13px 40px;
      border-radius: 12px; font-size: 15px; cursor: pointer;
    }
    #login.wrong input { border-color: #ef4444; }

    #app { display: none; width: 100%; height: 100%; }
    #map { width: 100%; height: 100%; }

    .panel {
      position: absolute; z-index: 1000;
      background: var(--panel); backdrop-filter: blur(20px);
      border: 1px solid var(--border); border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .left { top: 16px; left: 16px; width: 280px; padding: 16px; }
    .bottom {
      bottom: 18px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 12px;
      padding: 11px 20px; min-width: 600px;
    }
    .dbz-legend {
      bottom: 100px; right: 16px; padding: 12px 14px; width: 148px;
    }

    h3 {
      font-size: 11px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 11px;
    }
    .row { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 9px; }

    button {
      background: #1e293b; border: 1px solid var(--border);
      color: var(--text); padding: 7px 12px; border-radius: 9px;
      cursor: pointer; font-size: 13px; transition: 0.15s;
    }
    button:hover { background: #334155; }
    button.active { background: var(--accent); border-color: var(--accent); }

    select {
      width: 100%; background: #1e293b; border: 1px solid var(--border);
      color: var(--text); padding: 7px 10px; border-radius: 9px; font-size: 13px;
    }
    input[type=range] { width: 100%; accent-color: var(--accent); }
    label { font-size: 13px; color: var(--muted); }

    #time { font-variant-numeric: tabular-nums; font-size: 15px; min-width: 145px; text-align: center; }
    #frame { font-size: 12px; color: var(--muted); text-align: center; margin-top: 3px; }
    .slider-wrap { flex: 1; min-width: 220px; }

    .dbz-item {
      display: flex; align-items: center; gap: 8px;
      margin: 4px 0; font-size: 12px;
    }
    .dbz-color {
      width: 16px; height: 14px; border-radius: 3px;
    }
  </style>
</head>
<body>

<div id="login">
  <h1>TIMUR RADAR</h1>
  <input type="password" id="pass" placeholder="Пароль" autofocus>
  <button id="btnLogin">Войти</button>
</div>

<div id="app">
  <div id="map"></div>

  <div class="panel left">
    <h3>Слои</h3>
    <div class="row">
      <button id="btnRadar" class="active">Радар</button>
      <button id="btnSat">Спутник</button>
    </div>
    <div class="row">
      <button id="btnAlerts">ОЯ</button>
      <button id="btnArrows" class="active">Движение</button>
    </div>

    <h3 style="margin-top:14px">Цвет радара</h3>
    <select id="scheme">
      <option value="2">Universal Blue</option>
      <option value="7">Rainbow</option>
      <option value="4">TWC</option>
      <option value="6">NEXRAD</option>
      <option value="3">TITAN</option>
      <option value="8">Dark Sky</option>
      <option value="0">Ч/Б</option>
    </select>

    <div class="row" style="margin-top:12px">
      <label>Прозрачность <span id="opVal">75%</span></label>
    </div>
    <input type="range" id="opacity" min="20" max="100" value="75">

    <div class="row" style="margin-top:14px">
      <button id="locate" style="width:100%">📍 Моё место</button>
    </div>
  </div>

  <div class="panel bottom">
    <button id="prev">◀</button>
    <button id="play">▶</button>
    <button id="next">▶</button>
    <div class="slider-wrap">
      <input type="range" id="slider" min="0" max="0" value="0">
      <div id="frame">кадр 0 / 0</div>
    </div>
    <div id="time">--:--</div>
  </div>

  <!-- Панель dBZ -->
  <div class="panel dbz-legend">
    <h3>Интенсивность</h3>
    <div class="dbz-item"><div class="dbz-color" style="background:#22c55e"></div>5–15 dBZ</div>
    <div class="dbz-item"><div class="dbz-color" style="background:#3b82f6"></div>15–30 dBZ</div>
    <div class="dbz-item"><div class="dbz-color" style="background:#eab308"></div>30–40 dBZ</div>
    <div class="dbz-item"><div class="dbz-color" style="background:#f97316"></div>40–50 dBZ</div>
    <div class="dbz-item"><div class="dbz-color" style="background:#ef4444"></div>50+ dBZ</div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const PASS = 'timurradar';
  const API = 'https://api.librewxr.net';

  document.getElementById('btnLogin').onclick = tryLogin;
  document.getElementById('pass').addEventListener('keydown', e => e.key === 'Enter' && tryLogin());

  function tryLogin() {
    if (document.getElementById('pass').value === PASS) {
      document.getElementById('login').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      init();
    } else {
      document.getElementById('login').classList.add('wrong');
      document.getElementById('pass').value = '';
      document.getElementById('pass').placeholder = 'Неверный пароль';
    }
  }

  let map, frames = [], satFrames = [];
  let cur = 0;
  let radarLayer = null, satLayer = null, alertsLayer = null;
  let showRadar = true, showSat = false, showAlerts = false, showArrows = true;
  let scheme = 2, playing = false, timer = null;

  function init() {
    map = L.map('map', { zoomControl: false }).setView([55.75, 37.62], 6);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 18,
      attribution: '© OSM © CARTO | LibreWXR'
    }).addTo(map);

    loadData();
    setInterval(loadData, 4 * 60 * 1000);
  }

  async function loadData() {
    try {
      const res = await fetch(API + '/public/weather-maps.json?' + Date.now());
      const data = await res.json();

      frames = [...(data.radar?.past || []), ...(data.radar?.nowcast || [])];
      satFrames = data.satellite?.infrared || [];

      const slider = document.getElementById('slider');
      slider.max = Math.max(0, frames.length - 1);
      if (cur >= frames.length) cur = frames.length - 1;
      slider.value = cur;

      updateLayers();
      if (showAlerts) loadAlerts();
    } catch (e) {
      console.error(e);
    }
  }

  function updateLayers() {
    if (!frames.length) return;

    // Радар
    if (radarLayer) {
      map.removeLayer(radarLayer);
      radarLayer = null;
    }
    if (showRadar) {
      const f = frames[cur];
      let url = `${API}/v2/radar/${f.time}/256/{z}/{x}/{y}/${scheme}/1_1.png`;
      if (showArrows) url += '?arrows=light';
      radarLayer = L.tileLayer(url, {
        opacity: document.getElementById('opacity').value / 100,
        zIndex: 40
      }).addTo(map);
    }

    // Спутник
    if (satLayer) {
      map.removeLayer(satLayer);
      satLayer = null;
    }
    if (showSat && satFrames.length) {
      const target = frames[cur].time;
      let best = satFrames[0];
      let bestDiff = Math.abs(best.time - target);
      for (const s of satFrames) {
        const d = Math.abs(s.time - target);
        if (d < bestDiff) {
          bestDiff = d;
          best = s;
        }
      }
      satLayer = L.tileLayer(
        `${API}/v2/satellite/${best.time}/256/{z}/{x}/{y}/0/0_0.png`,
        { opacity: 0.72, zIndex: 20 }
      ).addTo(map);
    }

    // UI
    document.getElementById('slider').value = cur;
    document.getElementById('frame').textContent = `кадр ${cur + 1} / ${frames.length}`;
    const d = new Date(frames[cur].time * 1000);
    document.getElementById('time').textContent = d.toLocaleString('ru-RU', {
      day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'
    });
  }

  async function loadAlerts() {
    if (alertsLayer) {
      map.removeLayer(alertsLayer);
      alertsLayer = null;
    }
    if (!showAlerts) return;

    try {
      const res = await fetch(API + '/v2/alerts?' + Date.now());
      const geo = await res.json();

      alertsLayer = L.geoJSON(geo, {
        style: f => {
          const s = (f.properties.severity || '').toLowerCase();
          let c = '#ef4444';
          if (s.includes('moderate') || s.includes('minor')) c = '#f59e0b';
          if (s.includes('extreme')) c = '#dc2626';
          return {
            color: c,
            weight: 2.5,
            fillColor: c,
            fillOpacity: 0.22,
            opacity: 0.9
          };
        },
        onEachFeature: (f, l) => {
          const p = f.properties;
          l.bindPopup(
            `<b>${p.event || 'Опасное явление'}</b><br>` +
            `${p.headline || ''}<br>` +
            `<small style="color:#94a3b8">${p.severity || ''} · ${p.areaDesc || ''}</small>`
          );
        }
      }).addTo(map);
    } catch (e) {
      console.error(e);
    }
  }

  // Кнопки слоёв
  document.getElementById('btnRadar').onclick = function () {
    showRadar = !showRadar;
    this.classList.toggle('active', showRadar);
    updateLayers();
  };
  document.getElementById('btnSat').onclick = function () {
    showSat = !showSat;
    this.classList.toggle('active', showSat);
    updateLayers();
  };
  document.getElementById('btnAlerts').onclick = function () {
    showAlerts = !showAlerts;
    this.classList.toggle('active', showAlerts);
    loadAlerts();
  };
  document.getElementById('btnArrows').onclick = function () {
    showArrows = !showArrows;
    this.classList.toggle('active', showArrows);
    updateLayers();
  };

  // Управление временем
  document.getElementById('prev').onclick = () => {
    cur = Math.max(0, cur - 1);
    updateLayers();
  };
  document.getElementById('next').onclick = () => {
    cur = Math.min(frames.length - 1, cur + 1);
    updateLayers();
  };
  document.getElementById('slider').oninput = e => {
    cur = +e.target.value;
    updateLayers();
  };

  document.getElementById('play').onclick = function () {
    playing = !playing;
    this.textContent = playing ? '⏸' : '▶';
    if (playing) {
      timer = setInterval(() => {
        cur = (cur + 1) % frames.length;
        updateLayers();
      }, 700);
    } else {
      clearInterval(timer);
    }
  };

  document.getElementById('scheme').onchange = e => {
    scheme = +e.target.value;
    updateLayers();
  };
  document.getElementById('opacity').oninput = e => {
    document.getElementById('opVal').textContent = e.target.value + '%';
    if (radarLayer) radarLayer.setOpacity(e.target.value / 100);
  };
  document.getElementById('locate').onclick = () => map.locate({ setView: true, maxZoom: 9 });
</script>
</body>
</html>
