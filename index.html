<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Радарная карта</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #0d1117;
      --panel: rgba(22, 27, 34, 0.92);
      --border: #30363d;
      --text: #e6edf3;
      --accent: #238636;
      --blue: #1f6feb;
      --red: #da3633;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; overflow: hidden; }
    #map { width: 100vw; height: 100vh; background: #0d1117; }

    /* ===== Панели ===== */
    .panel {
      position: absolute; z-index: 1000;
      background: var(--panel); backdrop-filter: blur(12px);
      border: 1px solid var(--border); border-radius: 12px;
      padding: 14px; box-shadow: 0 8px 32px rgba(0,0,0,0.45);
    }
    .top-left { top: 14px; left: 14px; width: 340px; }
    .bottom-center {
      bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 10px;
      padding: 10px 16px; min-width: 520px;
    }
    .right-panel { top: 14px; right: 14px; width: 260px; }

    h3 { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; }
    .row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
    label { font-size: 13px; display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }

    button, .btn {
      background: #21262d; border: 1px solid var(--border); color: var(--text);
      padding: 7px 12px; border-radius: 8px; cursor: pointer; font-size: 13px;
      transition: all 0.15s;
    }
    button:hover, .btn:hover { background: #30363d; border-color: #8b949e; }
    button.active { background: var(--blue); border-color: var(--blue); }
    button.danger { background: #21262d; }
    button.danger:hover { background: var(--red); border-color: var(--red); }

    input[type=range] { width: 100%; accent-color: var(--blue); }
    select {
      background: #21262d; border: 1px solid var(--border); color: var(--text);
      padding: 6px 10px; border-radius: 8px; font-size: 13px; width: 100%;
    }

    #time-display { font-variant-numeric: tabular-nums; font-size: 14px; min-width: 150px; text-align: center; }
    #frame-info { font-size: 12px; color: #8b949e; text-align: center; margin-top: 4px; }

    .slider-box { flex: 1; min-width: 180px; }
    .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .color-box { display: flex; gap: 6px; align-items: center; }
    .color-box input[type=color] { width: 36px; height: 28px; border: none; background: none; cursor: pointer; }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- Левая панель -->
  <div class="panel top-left">
    <h3>Радарная карта</h3>

    <div class="row">
      <button id="btnRadar" class="active">Радар</button>
      <button id="btnSat">Спутник</button>
      <button id="btnBoth">Оба</button>
    </div>

    <div class="row">
      <label>Цветовая схема</label>
    </div>
    <select id="colorScheme">
      <option value="2">Universal Blue</option>
      <option value="0">Black & White</option>
      <option value="1">Original</option>
      <option value="3">TITAN</option>
      <option value="4">The Weather Channel</option>
      <option value="5">Meteored</option>
      <option value="6">NEXRAD Level-III</option>
      <option value="7">Rainbow @ SELEX</option>
      <option value="8">Dark Sky</option>
    </select>

    <div class="row" style="margin-top:12px">
      <label>Прозрачность радара <span id="opVal">75%</span></label>
    </div>
    <input type="range" id="opacity" min="20" max="100" value="75">

    <div class="row" style="margin-top:14px">
      <button id="locate">📍 Моё местоположение</button>
    </div>
  </div>

  <!-- Правая панель — рисование -->
  <div class="panel right-panel">
    <h3>Рисование</h3>
    <div class="tools">
      <button id="toolPen" class="active">Карандаш</button>
      <button id="toolEraser">Ластик</button>
    </div>

    <div class="row" style="margin-top:12px">
      <label>Цвет и толщина</label>
    </div>
    <div class="color-box">
      <input type="color" id="drawColor" value="#FF3B30">
      <input type="range" id="drawWidth" min="1" max="20" value="4" style="flex:1">
      <span id="widthVal">4 px</span>
    </div>

    <div class="row" style="margin-top:14px">
      <button id="clearDraw" class="danger" style="width:100%">Очистить всё</button>
    </div>
  </div>

  <!-- Нижняя панель управления временем -->
  <div class="panel bottom-center">
    <button id="prev">◀</button>
    <button id="play">▶</button>
    <button id="next">▶</button>

    <div class="slider-box">
      <input type="range" id="timeSlider" min="0" max="0" value="0">
      <div id="frame-info">кадр 0 / 0</div>
    </div>

    <div id="time-display">--:--</div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ===================== НАСТРОЙКИ =====================
    const API = 'https://api.librewxr.net';

    // ===================== КАРТА =====================
    const map = L.map('map', {
      zoomControl: false,
      attributionControl: true
    }).setView([55.75, 37.62], 6);

    L.control.zoom({ position: 'bottomright' }).addTo(map);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 18,
      attribution: '© OpenStreetMap © CARTO | Данные: LibreWXR'
    }).addTo(map);

    // ===================== СОСТОЯНИЕ =====================
    let radarFrames = [];
    let satFrames = [];
    let current = 0;
    let radarLayer = null;
    let satLayer = null;
    let playing = false;
    let playTimer = null;
    let mode = 'radar'; // radar | sat | both
    let colorScheme = 2;

    // ===================== РИСОВАНИЕ =====================
    const drawCanvas = L.canvas({ padding: 0.5 });
    let drawing = false;
    let currentPath = null;
    let drawTool = 'pen'; // pen | eraser
    let paths = [];

    const drawLayer = L.layerGroup().addTo(map);

    map.on('mousedown', e => {
      if (e.originalEvent.button !== 0) return;
      drawing = true;
      const latlng = e.latlng;
      currentPath = L.polyline([latlng], {
        color: drawTool === 'pen' ? document.getElementById('drawColor').value : '#00000000',
        weight: +document.getElementById('drawWidth').value,
        opacity: drawTool === 'pen' ? 1 : 0,
        lineCap: 'round',
        lineJoin: 'round'
      }).addTo(drawLayer);
      paths.push(currentPath);
    });

    map.on('mousemove', e => {
      if (!drawing || !currentPath) return;
      currentPath.addLatLng(e.latlng);
    });

    map.on('mouseup', () => { drawing = false; currentPath = null; });
    map.on('mouseout', () => { drawing = false; currentPath = null; });

    // ===================== ЗАГРУЗКА ДАННЫХ =====================
    async function loadData() {
      try {
        const res = await fetch(`${API}/public/weather-maps.json`);
        const data = await res.json();

        radarFrames = [
          ...(data.radar?.past || []),
          ...(data.radar?.nowcast || [])
        ];
        satFrames = data.satellite?.infrared || [];

        const slider = document.getElementById('timeSlider');
        slider.max = Math.max(0, radarFrames.length - 1);
        slider.value = radarFrames.length - 1;
        current = radarFrames.length - 1;

        showFrame(current);
      } catch (err) {
        console.error(err);
        document.getElementById('time-display').textContent = 'Ошибка загрузки';
      }
    }

    // ===================== ПОКАЗ КАДРА =====================
    function showFrame(idx) {
      if (radarFrames.length === 0) return;
      current = Math.max(0, Math.min(idx, radarFrames.length - 1));

      // Радар
      if (radarLayer) map.removeLayer(radarLayer);
      if (mode === 'radar' || mode === 'both') {
        const f = radarFrames[current];
        radarLayer = L.tileLayer(
          `${API}/v2/radar/${f.time}/256/{z}/{x}/{y}/${colorScheme}/1_1.png`,
          { opacity: document.getElementById('opacity').value / 100, zIndex: 25 }
        ).addTo(map);
      }

      // Спутник
      if (satLayer) map.removeLayer(satLayer);
      if ((mode === 'sat' || mode === 'both') && satFrames.length) {
        const target = radarFrames[current]?.time || Date.now() / 1000;
        const best = satFrames.reduce((a, b) =>
          Math.abs(b.time - target) < Math.abs(a.time - target) ? b : a
        );
        satLayer = L.tileLayer(
          `${API}/v2/satellite/${best.time}/256/{z}/{x}/{y}/0/0_0.png`,
          { opacity: 0.7, zIndex: 15 }
        ).addTo(map);
      }

      // UI
      document.getElementById('timeSlider').value = current;
      document.getElementById('frame-info').textContent =
        `кадр ${current + 1} / ${radarFrames.length}`;

      const ts = radarFrames[current].time;
      const d = new Date(ts * 1000);
      document.getElementById('time-display').textContent =
        d.toLocaleString('ru-RU', {
          day: '2-digit', month: '2-digit',
          hour: '2-digit', minute: '2-digit'
        });
    }

    // ===================== УПРАВЛЕНИЕ =====================
    document.getElementById('prev').onclick = () => showFrame(current - 1);
    document.getElementById('next').onclick = () => showFrame(current + 1);

    document.getElementById('play').onclick = function () {
      playing = !playing;
      this.textContent = playing ? '⏸' : '▶';
      if (playing) {
        playTimer = setInterval(() => {
          let n = current + 1;
          if (n >= radarFrames.length) n = 0;
          showFrame(n);
        }, 700);
      } else clearInterval(playTimer);
    };

    document.getElementById('timeSlider').oninput = function () {
      showFrame(+this.value);
    };

    // Режимы
    document.getElementById('btnRadar').onclick = function () {
      mode = 'radar';
      document.querySelectorAll('.top-left button').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      showFrame(current);
    };
    document.getElementById('btnSat').onclick = function () {
      mode = 'sat';
      document.querySelectorAll('.top-left button').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      showFrame(current);
    };
    document.getElementById('btnBoth').onclick = function () {
      mode = 'both';
      document.querySelectorAll('.top-left button').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      showFrame(current);
    };

    // Цвет и прозрачность
    document.getElementById('colorScheme').onchange = function () {
      colorScheme = +this.value;
      showFrame(current);
    };
    document.getElementById('opacity').oninput = function () {
      document.getElementById('opVal').textContent = this.value + '%';
      if (radarLayer) radarLayer.setOpacity(this.value / 100);
    };

    // Рисование
    document.getElementById('toolPen').onclick = function () {
      drawTool = 'pen';
      document.getElementById('toolPen').classList.add('active');
      document.getElementById('toolEraser').classList.remove('active');
    };
    document.getElementById('toolEraser').onclick = function () {
      drawTool = 'eraser';
      document.getElementById('toolEraser').classList.add('active');
      document.getElementById('toolPen').classList.remove('active');
    };
    document.getElementById('drawWidth').oninput = function () {
      document.getElementById('widthVal').textContent = this.value + ' px';
    };
    document.getElementById('clearDraw').onclick = () => {
      drawLayer.clearLayers();
      paths = [];
    };

    document.getElementById('locate').onclick = () => {
      map.locate({ setView: true, maxZoom: 9 });
    };

    // Старт
    loadData();
    setInterval(loadData, 5 * 60 * 1000);
  </script>
</body>
</html>
