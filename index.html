<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Радарная карта</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #0b0f14;
      --panel: rgba(15, 20, 28, 0.94);
      --border: #2a3340;
      --text: #e6edf3;
      --blue: #3b82f6;
      --green: #22c55e;
      --orange: #f59e0b;
      --red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; overflow: hidden; }
    #map { width: 100vw; height: 100vh; }

    .panel {
      position: absolute; z-index: 1000;
      background: var(--panel); backdrop-filter: blur(16px);
      border: 1px solid var(--border); border-radius: 14px;
      padding: 14px 16px; box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    }
    .top-left { top: 16px; left: 16px; width: 300px; }
    .bottom {
      bottom: 18px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 12px;
      padding: 10px 18px; min-width: 560px;
    }

    h3 { font-size: 12px; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 12px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    label { font-size: 13px; display: flex; align-items: center; gap: 6px; }

    button {
      background: #1e293b; border: 1px solid var(--border); color: var(--text);
      padding: 7px 13px; border-radius: 9px; cursor: pointer; font-size: 13px;
      transition: all 0.15s;
    }
    button:hover { background: #334155; }
    button.active { background: var(--blue); border-color: var(--blue); }

    select, input[type=range] { width: 100%; }
    select {
      background: #1e293b; border: 1px solid var(--border); color: var(--text);
      padding: 7px 10px; border-radius: 8px; font-size: 13px;
    }
    input[type=range] { accent-color: var(--blue); }

    #time { font-variant-numeric: tabular-nums; font-size: 15px; min-width: 145px; text-align: center; font-weight: 500; }
    #frame { font-size: 12px; color: #94a3b8; text-align: center; margin-top: 3px; }
    .slider-wrap { flex: 1; min-width: 200px; }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="panel top-left">
    <h3>Слои</h3>
    <div class="row">
      <button id="btnRadar" class="active">Радар</button>
      <button id="btnSat">Спутник</button>
      <button id="btnBoth">Оба</button>
    </div>
    <div class="row">
      <button id="btnAlerts">ОЯ</button>
      <button id="btnCells">Ячейки</button>
    </div>

    <h3 style="margin-top:14px">Цвет радара</h3>
    <select id="scheme">
      <option value="2">Universal Blue</option>
      <option value="7">Rainbow</option>
      <option value="4">TWC</option>
      <option value="6">NEXRAD</option>
      <option value="3">TITAN</option>
      <option value="8">Dark Sky</option>
      <option value="0">Ч/Б</option>
      <option value="1">Original</option>
    </select>

    <div class="row" style="margin-top:12px">
      <label>Прозрачность <span id="opVal">70%</span></label>
    </div>
    <input type="range" id="opacity" min="20" max="100" value="70">

    <div class="row" style="margin-top:14px">
      <button id="locate" style="width:100%">📍 Моё место</button>
    </div>
  </div>

  <div class="panel bottom">
    <button id="prev">◀</button>
    <button id="play">▶</button>
    <button id="next">▶</button>

    <div class="slider-wrap">
      <input type="range" id="slider" min="0" max="0" value="0">
      <div id="frame">кадр 0 / 0</div>
    </div>

    <div id="time">--:--</div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const API = 'https://api.librewxr.net';

    const map = L.map('map', { zoomControl: false }).setView([55.75, 37.62], 6);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 18,
      attribution: '© OSM © CARTO | LibreWXR'
    }).addTo(map);

    let frames = [], satFrames = [];
    let cur = 0;
    let radarL = null, satL = null, alertsL = null;
    let mode = 'radar';
    let scheme = 2;
    let showAlerts = false;
    let showCells = false;
    let playing = false;
    let timer = null;

    async function load() {
      const r = await fetch(`${API}/public/weather-maps.json`);
      const d = await r.json();
      frames = [...(d.radar?.past || []), ...(d.radar?.nowcast || [])];
      satFrames = d.satellite?.infrared || [];
      document.getElementById('slider').max = Math.max(0, frames.length - 1);
      document.getElementById('slider').value = frames.length - 1;
      cur = frames.length - 1;
      show(cur);
      if (showAlerts) loadAlerts();
    }

    function show(i) {
      if (!frames.length) return;
      cur = Math.max(0, Math.min(i, frames.length - 1));

      if (radarL) map.removeLayer(radarL);
      if (mode === 'radar' || mode === 'both') {
        const f = frames[cur];
        let url = `${API}/v2/radar/${f.time}/256/{z}/{x}/{y}/${scheme}/1_1.png`;
        if (showCells) url += '?cells=light';
        radarL = L.tileLayer(url, {
          opacity: document.getElementById('opacity').value / 100,
          zIndex: 30
        }).addTo(map);
      }

      if (satL) map.removeLayer(satL);
      if ((mode === 'sat' || mode === 'both') && satFrames.length) {
        const t = frames[cur]?.time || Date.now()/1000;
        const best = satFrames.reduce((a,b) => Math.abs(b.time-t) < Math.abs(a.time-t) ? b : a);
        satL = L.tileLayer(`${API}/v2/satellite/${best.time}/256/{z}/{x}/{y}/0/0_0.png`, {
          opacity: 0.65, zIndex: 15
        }).addTo(map);
      }

      document.getElementById('slider').value = cur;
      document.getElementById('frame').textContent = `кадр ${cur+1} / ${frames.length}`;
      const d = new Date(frames[cur].time * 1000);
      document.getElementById('time').textContent = d.toLocaleString('ru-RU', {
        day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'
      });
    }

    async function loadAlerts() {
      if (alertsL) { map.removeLayer(alertsL); alertsL = null; }
      if (!showAlerts) return;
      try {
        const r = await fetch(`${API}/v2/alerts`);
        const g = await r.json();
        alertsL = L.geoJSON(g, {
          style: f => {
            const s = (f.properties.severity||'').toLowerCase();
            let c = '#ef4444';
            if (s.includes('moderate') || s.includes('minor')) c = '#f59e0b';
            if (s.includes('extreme')) c = '#dc2626';
            return { color: c, weight: 2, fillColor: c, fillOpacity: 0.22 };
          },
          onEachFeature: (f, l) => {
            const p = f.properties;
            l.bindPopup(`<b>${p.event||'ОЯ'}</b><br>${p.headline||''}<br><small>${p.severity||''} · ${p.areaDesc||''}</small>`);
          }
        }).addTo(map);
      } catch(e) { console.error(e); }
    }

    // кнопки
    document.getElementById('prev').onclick = () => show(cur-1);
    document.getElementById('next').onclick = () => show(cur+1);
    document.getElementById('play').onclick = function() {
      playing = !playing;
      this.textContent = playing ? '⏸' : '▶';
      if (playing) timer = setInterval(() => show(cur+1 >= frames.length ? 0 : cur+1), 700);
      else clearInterval(timer);
    };
    document.getElementById('slider').oninput = e => show(+e.target.value);

    document.getElementById('btnRadar').onclick = function() {
      mode='radar'; document.querySelectorAll('.top-left button').forEach(b=>b.classList.remove('active')); this.classList.add('active'); show(cur);
    };
    document.getElementById('btnSat').onclick = function() {
      mode='sat'; document.querySelectorAll('.top-left button').forEach(b=>b.classList.remove('active')); this.classList.add('active'); show(cur);
    };
    document.getElementById('btnBoth').onclick = function() {
      mode='both'; document.querySelectorAll('.top-left button').forEach(b=>b.classList.remove('active')); this.classList.add('active'); show(cur);
    };
    document.getElementById('btnAlerts').onclick = function() {
      showAlerts = !showAlerts; this.classList.toggle('active', showAlerts); loadAlerts();
    };
    document.getElementById('btnCells').onclick = function() {
      showCells = !showCells; this.classList.toggle('active', showCells); show(cur);
    };
    document.getElementById('scheme').onchange = e => { scheme = +e.target.value; show(cur); };
    document.getElementById('opacity').oninput = e => {
      document.getElementById('opVal').textContent = e.target.value + '%';
      if (radarL) radarL.setOpacity(e.target.value/100);
    };
    document.getElementById('locate').onclick = () => map.locate({setView:true, maxZoom:9});

    load();
    setInterval(load, 5*60*1000);
  </script>
</body>
</html>
